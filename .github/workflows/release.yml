name: Publish plugin release

# Updating main verifies the plugin; only an explicitly pushed version tag publishes it.
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Verify version and install assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs --tag "$RELEASE_TAG"
      - name: Attest checked release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/main.js
            ${{ github.workspace }}/manifest.json
            ${{ github.workspace }}/styles.css
            ${{ github.workspace }}/dist/draft-companion-${{ github.ref_name }}.zip
          create-storage-record: false
      - name: Publish checked assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            main.js manifest.json styles.css "dist/draft-companion-${RELEASE_TAG}.zip" \
            --verify-tag --title "Draft Companion ${RELEASE_TAG}" --generate-notes
